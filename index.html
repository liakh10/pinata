<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pinata Cat</title>
<meta name="description" content="A blindfolded cat, a piñata, every legendary meme inside" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#1f1a14; --cream:#fbf5e6; --lime:#b6e83c; --pink:#ff5fa8; --orange:#ff8c3a; --dusk:#2a1a3a; --dim:#8a7a66;
  --disp:"Bungee",system-ui,sans-serif; --mono:"Space Mono",ui-monospace,monospace;
  --pad:clamp(14px,2.6vw,34px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--dusk);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,canvas{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* bevel keys, like the references */
.key{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;font-family:var(--disp);font-size:12px;letter-spacing:.06em;background:var(--cream);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .14s,box-shadow .14s}
.key:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.key.lime{background:var(--lime)}
.key.pink{background:var(--pink)}
.key svg{width:14px;height:14px}
.key img{width:24px;height:24px;border:2px solid var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* ================= SCENE ================= */
.scene{position:relative;height:100svh;min-height:560px;overflow:hidden;background:var(--dusk)}
.scene .bg{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;object-position:50% 60%;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.05) translate(-1%,.5%)}}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.45;mix-blend-mode:multiply}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(31,26,20,.55) 100%)}
.hud{position:absolute;z-index:9}
.tl{left:var(--pad);top:var(--pad)}
.tr{right:var(--pad);top:var(--pad);display:flex;gap:8px}
.br{right:var(--pad);bottom:var(--pad);font-family:var(--disp);font-size:12px;letter-spacing:.1em;color:var(--cream);text-shadow:2px 2px 0 var(--ink);display:flex;gap:6px;align-items:center}
.br i{width:12px;height:12px;background:var(--cream);border:2px solid var(--ink)}
.br i.on{background:var(--lime)}

.stage{position:absolute;inset:0;z-index:5}
.stage.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,3px)}80%{transform:translate(5px,-2px)}}
.rope{position:absolute;left:56%;top:-2%;width:4px;height:26%;background:#7a5a3a;transform-origin:50% 0;animation:pend 4.2s ease-in-out infinite;z-index:4}
.pin{position:absolute;left:56%;top:23%;width:min(28vw,340px);transform-origin:50% -60%;transform:translateX(-50%);animation:pend 4.2s ease-in-out infinite;filter:drop-shadow(0 18px 14px rgba(0,0,0,.35))}
@keyframes pend{0%,100%{transform:translateX(-50%) rotate(-4deg)}50%{transform:translateX(-50%) rotate(4deg)}}
.pin img{width:100%;position:absolute;left:0;top:0;opacity:0;transition:opacity .12s}
.pin img.on{opacity:1}
.pin.hitL{animation:hitL .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes hitL{0%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(34deg)}60%{transform:translateX(-50%) rotate(-14deg)}100%{transform:translateX(-50%) rotate(0)}}
.pin.gone{animation:none;transform:translateX(-50%) rotate(0)}
.pin.drop{animation:drop .9s cubic-bezier(.2,1.3,.4,1)}
@keyframes drop{from{transform:translateX(-50%) translateY(-140%)}to{transform:translateX(-50%) translateY(0)}}
.cat{position:absolute;left:24%;bottom:5%;width:min(34vw,420px);aspect-ratio:1;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 22px 16px rgba(0,0,0,.4))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cat img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;position:absolute;left:0;bottom:0;opacity:0;transition:opacity .08s}
.cat img.on{opacity:1}
.cat img.hit{width:178%;height:auto;bottom:4%;object-fit:unset}
.cat.lunge{transform:translateX(7%) !important}
.fx{position:absolute;inset:0;z-index:8;pointer-events:none}
.mark{position:absolute;left:var(--pad);bottom:var(--pad);z-index:9;font-family:var(--disp);font-size:clamp(26px,4vw,54px);line-height:.95;color:var(--cream);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);pointer-events:none}
.mark em{font-style:normal;color:var(--lime)}

/* ================= PANEL (gote style) ================= */
.panel{position:relative;z-index:2;background:var(--cream);border-top:4px solid var(--ink);padding:clamp(28px,5vw,60px) var(--pad)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(1120px,100%);margin:0 auto}
.tile{background:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 8px 10px;text-align:center;transition:transform .14s,box-shadow .14s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tile img{width:64%;aspect-ratio:1;object-fit:contain;margin:0 auto 8px}
.tile b{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.04em}
.sign{width:min(600px,100%);margin:clamp(24px,4vw,44px) auto 0;background:#fff;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px;display:grid;gap:12px;justify-items:center}
.ca{display:grid;justify-items:center;gap:8px;width:100%;padding:14px 16px;background:var(--ink);color:var(--cream);cursor:pointer}
.ca .tag{font-family:var(--disp);font-size:10px;letter-spacing:.3em;color:var(--pink)}
.ca .ca-val{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--lime);white-space:nowrap;max-width:100%;line-height:1.2}
.ca.live .ca-val{font-size:clamp(10px,2.4vw,15px);letter-spacing:.02em}
.ca .cp{font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:var(--cream);padding:6px 12px;border:2px dashed rgba(251,245,230,.5)}
.ca.live{box-shadow:0 0 0 3px var(--lime),0 0 30px rgba(182,232,60,.55)}
.ca.live .cp{border-style:solid;border-color:var(--lime);color:var(--lime)}
.sign .btns{justify-content:center}
.end{width:min(1120px,100%);margin:24px auto 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--disp);font-size:9px;letter-spacing:.08em;color:var(--dim)}

@media (max-width:820px){
  .tr .key span{display:none}
  .tr .key{padding:0 11px}
  .tl .key span{display:none}
  .rope{left:66%;height:44%}
  .pin{left:66%;top:42%;width:min(46vw,190px)}
  .cat{left:2%;bottom:16%;width:min(58vw,260px)}
  .mark{font-size:26px;bottom:calc(var(--pad) + 30px)}
  .br{bottom:var(--pad)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .ca .ca-val{font-size:18px}
  .scene .bg{object-position:60% 60%}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<section class="scene" id="scene">
  <img class="bg" src="assets/bg.webp" alt="" />
  <div class="stage" id="stage">
    <div class="rope" id="rope"></div>
    <div class="pin" id="pin"><img class="on" src="assets/pin-0.webp" alt="" /><img src="assets/pin-1.webp" alt="" /><img src="assets/pin-2.webp" alt="" /></div>
    <div class="cat" id="cat"><img class="on" src="assets/cat-idle.webp" alt="" /><img src="assets/cat-up.webp" alt="" /><img class="hit" src="assets/cat-hit.webp" alt="" /></div>
    <canvas class="fx" id="fx"></canvas>
  </div>
  <div class="scan"></div><div class="vig"></div>

  <a class="hud tl key" href="/"><img src="assets/favicon.png" alt="" /><span data-name>PINATA CAT</span></a>
  <nav class="hud tr">
    <a class="key lime" data-link="pons" href="https://www.ponsfamily.com/launchpad"><span>BUY</span><svg><use href="#i-pons"/></svg></a>
    <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
    <a class="key pink" href="/docs"><span>DOCS</span></a>
  </nav>
  <div class="mark">PINATA<br /><em>CAT</em></div>
  <div class="hud br"><i></i><i></i><i></i></div>
</section>

<section class="panel" id="panel">
  <div class="tiles" id="tiles"></div>
  <div class="sign">
    <div class="ca" id="ca"><span class="tag">CONTRACT</span><b class="ca-val" id="caVal">soon</b><button class="cp" id="caCopy">[ COPY ]</button></div>
    <div class="btns">
      <a class="key lime" data-link="pons" href="https://www.ponsfamily.com/launchpad">BUY ON PONS<svg><use href="#i-pons"/></svg></a>
      <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
      <a class="key pink" href="/docs">DOCS</a>
    </div>
  </div>
  <div class="end"><span data-name>PINATA CAT</span><span>ROBINHOOD CHAIN · PONS</span></div>
</section>

<audio id="bgm" src="assets/music.mp3" loop preload="none"></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pons" viewBox="0 0 64 64"><path d="M14 8h24c11 0 18 7 18 17s-7 17-18 17h-9v12a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3z" fill="currentColor"/><path d="M29 20h8c4 0 6.5 2 6.5 5s-2.5 5-6.5 5h-8z" fill="#fff" opacity=".9"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-7.1 8.1L23 22h-6.6l-5.2-6.8L5.3 22H2.1l7.6-8.7L1.5 2h6.7l4.7 6.2L18.9 2zm-1.1 18h1.8L7.3 3.9H5.4L17.8 20z"/></symbol>
</svg>

<script>
(function(){
  var S = window.SITE, CA = (S.CA||"SOON").trim(), HAS_CA = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-name]').forEach(function(e){ e.textContent = S.NAME.toUpperCase(); });
  document.title = S.NAME;
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS_CA ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target='_blank'; a.rel='noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target='_blank'; a.rel='noopener'; });
  var caBox = document.getElementById('ca'), caVal = document.getElementById('caVal'), caCopy = document.getElementById('caCopy');
  caVal.textContent = HAS_CA ? CA : 'soon';
  if(HAS_CA){ caBox.classList.add('live'); caBox.title = CA; }
  caBox.addEventListener('click', function(){ var old = caCopy.textContent; if(HAS_CA){ if(navigator.clipboard) navigator.clipboard.writeText(CA); caCopy.textContent = '[ COPIED ]'; } else { caCopy.textContent = '[ NOT YET ]'; } setTimeout(function(){ caCopy.textContent = old; }, 1400); });

  var bgm = document.getElementById('bgm'), armed = false, hasMusic = true;
  bgm.addEventListener('error', function(){ hasMusic = false; });
  function arm(){ if(armed) return; armed = true; if(hasMusic){ bgm.volume = .3; bgm.play().catch(function(){}); } }
  document.addEventListener('pointerdown', arm, true); document.addEventListener('keydown', arm, true);

  /* ---- the memes ---- */
  var memes = [['doge','Doge'],['pepe','Pepe'],['wojak','Wojak'],['troll','Troll'],['cheems','Cheems'],['chad','Gigachad'],['grumpy','Grumpy'],['nyan','Nyan'],['stonks','Stonks'],['amogus','Amogus']];
  var tiles = document.getElementById('tiles'), imgs = {};
  memes.forEach(function(m){ var t = document.createElement('div'); t.className = 'tile'; t.innerHTML = '<img src="assets/' + m[0] + '.webp" alt="" /><b>' + m[1] + '</b>'; tiles.appendChild(t); var im = new Image(); im.src = 'assets/' + m[0] + '.webp'; imgs[m[0]] = im; });

  /* ---- fx canvas ---- */
  var stage = document.getElementById('stage'), fx = document.getElementById('fx'), g = fx.getContext('2d'), parts = [], raf = null;
  function size(){ fx.width = stage.clientWidth * devicePixelRatio; fx.height = stage.clientHeight * devicePixelRatio; g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  size(); addEventListener('resize', size);
  var cols = ['#ff5fa8', '#ffd23f', '#3ddcff', '#ff8c3a', '#b6e83c', '#fbf5e6'];
  function pinPoint(){ var im = document.querySelector('#pin img.on') || document.querySelector('#pin img'), r = im.getBoundingClientRect(), s = stage.getBoundingClientRect(); return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height * .55 }; }
  function confetti(n, big){ var p = pinPoint(); for(var i = 0; i < n; i++) parts.push({ t: 'c', x: p.x, y: p.y, vx: (Math.random() - .5) * (big ? 26 : 14), vy: -Math.random() * (big ? 18 : 10) - 2, g: .35, w: 5 + Math.random() * 7, h: 7 + Math.random() * 9, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 110 + Math.random() * 60 }); loop(); }
  function burst(){ var p = pinPoint(), W = stage.clientWidth, sz = Math.min(150, Math.max(84, W * .15)); memes.forEach(function(m, i){ var ang = -Math.PI / 2 + (i - 4.5) / 4.5 * 1.1; var sp = 13 + Math.random() * 7; parts.push({ t: 'm', img: imgs[m[0]], x: p.x, y: p.y, vx: Math.cos(ang) * sp + (Math.random() - .5) * 4, vy: Math.sin(ang) * sp - 4, g: .5, s: sz, a: 0, va: (Math.random() - .5) * .3, rest: 0 }); }); confetti(220, true); loop(); }
  function loop(){ if(raf) return; raf = requestAnimationFrame(step); }
  function step(){
    var W = stage.clientWidth, H = stage.clientHeight; g.clearRect(0, 0, W, H); var alive = 0;
    parts.forEach(function(p){
      if(p.t === 'c'){ p.life--; if(p.life <= 0) return; alive++; p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; if(p.y > H + 20) p.life = 0; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.globalAlpha = Math.min(1, p.life / 40); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); }
      else { var floor = H * .9 - p.s / 2; if(p.rest < 3){ alive++; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.a += p.va; if(p.y > floor){ p.y = floor; p.vy = -p.vy * .45; p.vx *= .8; p.va *= .6; if(Math.abs(p.vy) < 1.2){ p.vy = 0; p.rest++; } } if(p.x < p.s / 2){ p.x = p.s / 2; p.vx = -p.vx * .6; } if(p.x > W - p.s / 2){ p.x = W - p.s / 2; p.vx = -p.vx * .6; } } g.save(); g.translate(p.x, p.y); g.rotate(p.a); if(p.img.complete) g.drawImage(p.img, -p.s / 2, -p.s / 2, p.s, p.s); g.restore(); }
    });
    parts = parts.filter(function(p){ return p.t === 'm' || p.life > 0; });
    if(alive){ raf = requestAnimationFrame(step); } else raf = null;
  }

  /* ---- the swing, on its own ---- */
  var cat = [].slice.call(document.querySelectorAll('#cat img')), pinImgs = [].slice.call(document.querySelectorAll('#pin img')), pin = document.getElementById('pin'), dots = [].slice.call(document.querySelectorAll('.br i')), hits = 0, busy = false, done = false;
  function pose(i){ cat.forEach(function(im, j){ im.classList.toggle('on', j === i); }); }
  function hit(){
    if(busy || done) return; busy = true;
    pose(1); setTimeout(function(){ pose(2); document.getElementById('cat').classList.add('lunge'); }, 180);
    setTimeout(function(){
      hits++; dots.forEach(function(d, i){ d.classList.toggle('on', i < hits); });
      stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
      pin.classList.remove('hitL'); void pin.offsetWidth; pin.classList.add('hitL');
      if(hits < 3){ pinImgs.forEach(function(im, i){ im.classList.toggle('on', i === Math.min(1, hits)); }); confetti(60 + hits * 30, false); }
      else { pinImgs.forEach(function(im, i){ im.classList.toggle('on', i === 2); }); pin.classList.add('gone'); burst(); done = true; }
    }, 360);
    setTimeout(function(){ pose(0); document.getElementById('cat').classList.remove('lunge'); busy = false; }, 800);
  }
  function reset(){ done = false; hits = 0; parts = []; g.clearRect(0, 0, fx.width, fx.height); dots.forEach(function(d){ d.classList.remove('on'); }); pinImgs.forEach(function(im, i){ im.classList.toggle('on', i === 0); }); pin.classList.remove('gone', 'hitL'); pin.classList.add('drop'); setTimeout(function(){ pin.classList.remove('drop'); }, 900); }
  var visible = true;
  if('IntersectionObserver' in window){ new IntersectionObserver(function(en){ visible = en[0].isIntersecting; }, { threshold: .2 }).observe(stage); }
  function cycle(){ if(!visible){ setTimeout(cycle, 800); return; } if(done){ reset(); setTimeout(cycle, 2200); return; } hit(); setTimeout(cycle, hits >= 3 ? 5200 : 1900); }
  setTimeout(cycle, 1400);
  window.__pc = { hit: hit, reset: reset, hits: function(){ return hits; } };
})();
</script>
</body>
</html>
